[project]
name = "iffarql"
version = "0.1.0"
description = "SGBD simplificado em terminal com IFFARQL"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-sugar>=1.1.1",
]

[tool.pytest.ini_options]
addopts = "-v"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iffarql"]
