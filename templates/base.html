<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}IFFagle{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Paleta do tema escuro do Google (Material dark usado na busca).
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        google: {
                            fundo:     '#202124',  // fundo da pagina
                            superficie:'#303134',  // caixas, campos, chips
                            borda:     '#3c4043',
                            texto:     '#e8eaed',
                            apagado:   '#9aa0a6',  // texto secundario
                            link:      '#8ab4f8',  // azul dos links
                            verde:     '#81c995',  // verde dos caminhos/URLs
                        }
                    }
                }
            }
        };
    </script>
    <script>
        // Aplica o tema antes da pagina pintar, para nao piscar branco.
        (function () {
            try {
                var salvo = localStorage.getItem('tema');
                var escuro = salvo
                    ? salvo === 'escuro'
                    : window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (escuro) document.documentElement.classList.add('dark');
            } catch (e) { /* localStorage bloqueado: segue no tema claro */ }
        })();
    </script>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased bg-white text-gray-800
             dark:bg-google-fundo dark:text-google-texto">
    <nav class="flex justify-between items-center px-6 py-3 border-b border-gray-200 dark:border-google-borda">
        {% if request.endpoint == 'home' %}
            <span></span>
        {% else %}
            <a href="{{ url_for('home') }}">
                <img src="{{ url_for('static', filename='logo.svg') }}" alt="IFFagle" class="h-6 w-auto">
            </a>
        {% endif %}

        <a href="{{ url_for('indexar') }}"
           class="text-sm text-gray-600 hover:underline dark:text-google-apagado">Indexar pasta</a>
    </nav>

    {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% if mensagens %}
            <div class="max-w-xl mx-auto mt-3 px-4 w-full">
                {% for categoria, mensagem in mensagens %}
                    <div class="mb-2 rounded px-4 py-2.5 text-sm border
                        {% if categoria == 'sucesso' %}bg-green-50 text-green-700 border-green-200
                            dark:bg-green-950 dark:text-google-verde dark:border-green-900
                        {% else %}bg-red-50 text-red-700 border-red-200
                            dark:bg-red-950 dark:text-red-300 dark:border-red-900{% endif %}">
                        {{ mensagem }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <main class="flex-1">
        {% block conteudo %}{% endblock %}
    </main>

    <button type="button" onclick="alternarTema()" id="botao-tema"
            title="Alternar tema claro/escuro" aria-label="Alternar tema claro/escuro"
            class="fixed bottom-5 right-5 z-40 p-3 rounded-full shadow-md border
                   bg-white border-gray-200 text-gray-600 hover:bg-gray-100
                   dark:bg-google-superficie dark:border-google-borda dark:text-google-apagado dark:hover:bg-google-borda">
        {# Lua: aparece no tema claro (clique para escurecer). #}
        <svg class="w-5 h-5 dark:hidden" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.79c-.45-.07-.9-.11-1.36-.11z"/>
        </svg>
        {# Sol: aparece no tema escuro (clique para clarear). #}
        <svg class="w-5 h-5 hidden dark:block" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1zm0 17a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0v-2a1 1 0 0 1 1-1zM2 12a1 1 0 0 1 1-1h2a1 1 0 1 1 0 2H3a1 1 0 0 1-1-1zm17 0a1 1 0 0 1 1-1h2a1 1 0 1 1 0 2h-2a1 1 0 0 1-1-1zM4.93 4.93a1 1 0 0 1 1.41 0l1.42 1.42a1 1 0 0 1-1.42 1.41L4.93 6.34a1 1 0 0 1 0-1.41zm11.31 11.31a1 1 0 0 1 1.41 0l1.42 1.42a1 1 0 0 1-1.42 1.41l-1.41-1.41a1 1 0 0 1 0-1.42zM19.07 4.93a1 1 0 0 1 0 1.41l-1.42 1.42a1 1 0 0 1-1.41-1.42l1.41-1.41a1 1 0 0 1 1.42 0zM7.76 16.24a1 1 0 0 1 0 1.42l-1.42 1.41a1 1 0 0 1-1.41-1.41l1.41-1.42a1 1 0 0 1 1.42 0z"/>
        </svg>
    </button>

    <script>
        function alternarTema() {
            var escuro = document.documentElement.classList.toggle('dark');
            try {
                localStorage.setItem('tema', escuro ? 'escuro' : 'claro');
            } catch (e) { /* sem localStorage: vale so para esta pagina */ }
        }
    </script>
</body>
</html>
